name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate manifest and runtime files
        run: python tools/package.py
      - name: Compile Lua and run behavioral tests
        shell: bash
        run: |
          find . -path './.research' -prune -o -name '*.lua' -print0 | xargs -0 -r -n1 luac5.1 -p
          lua5.1 tests/run.lua
      - name: Test packaging and publishing guards
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and validate installable ZIP
        run: python tools/package.py --output dist/QuestieZoneCompletion-dev-forever.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QuestieZoneCompletion-validation
          path: dist/*
          if-no-files-found: error
